name: 打包 macOS 安装包

on: workflow_dispatch

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: 构建应用并生成安装包
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          build_args=(--target "$TARGET" --bundles app)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              printf '无法从标签 %s 读取应用版本号，请使用 1.2.3 或 v1.2.3。\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
            printf '按标签 %s 构建应用版本 %s。\n' "$GITHUB_REF_NAME" "$version"
            build_args+=(--config "{\"version\":\"$version\"}")
          fi
          npm run tauri -- build "${build_args[@]}" -- --locked
          python3 scripts/package_macos.py --app "src-tauri/target/$TARGET/release/bundle/macos/GitControl.app" --output-dir release
      - uses: actions/upload-artifact@v4
        with:
          name: GitControl-${{ matrix.target }}
          path: release/*.dmg
          if-no-files-found: error
